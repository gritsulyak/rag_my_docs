[project]
name = "normdoc-assistant"
version = "0.2.0"
description = "Приватный RAG-ассистент по нормативным документам пользователя: локальный корпус, ответы со ссылками на источники. LlamaIndex + Qdrant + llama.cpp (Vulkan/CUDA/ROCm) + Langfuse"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "pymupdf>=1.24",
    "llama-index-core>=0.14.10",
    "llama-index-embeddings-huggingface>=0.6.1",
    "llama-index-vector-stores-qdrant>=0.8.1",
    "qdrant-client>=1.12.0,<1.14.0",
    "sentence-transformers>=3.0.0",
    "torch>=2.2",
    "langfuse>=2.50",
    "langchain-core>=0.3.40",
    "langchain-huggingface>=0.1.0",
    "ragas>=0.1.13",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "prometheus-client>=0.20",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ipykernel>=7.3.0",
]

[project.optional-dependencies]
report = [
    "jupytext>=1.16.0",
    "nbclient>=0.10.0",
    "nbformat>=5.10.0",
]
perf = [
    "matplotlib>=3.8",
    "psutil>=6.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

# Эмбеддинги и реранкер считаются на CPU, поэтому тянем CPU-сборку torch
# (без ~2.5 ГБ CUDA-колёс nvidia-*). Источник применяется и к транзитивной
# зависимости torch из sentence-transformers.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/normdoc"]